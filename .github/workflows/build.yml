name: build

on:
  push:
    branches: [ master, main, platform-tools-35.0.2 ]
    paths-ignore:
      - '**.md'
      - 'LICENSE.txt'
  pull_request:
  workflow_dispatch:
    inputs:
      toolchain:
        description: 'toolchain'
        type: choice
        options: [ ndk, zig ]
        default: ndk
      package-release:
    needs: [ prepare, build ]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-24.04
    concurrency:
      group: sdk-release-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download all four ABI build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: android-sdk-tools-*
          path: artifacts
          merge-multiple: false

      - name: Build complete Google SDK archives
        run: |
          set -euo pipefail
          python3 scripts/package_sdk.py \
            --version "${{ needs.prepare.outputs.version }}" \
            --artifacts artifacts \
            --output dist
          ls -lh dist

      - name: Publish complete SDK packages as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          TAG="$VERSION"
          git push --force origin "$GITHUB_SHA:refs/tags/$TAG"
          NOTES="Release packages for Android Platform Tools $VERSION and Build Tools $VERSION."
          printf '%s\n\nCommit: %s\n' "$NOTES" "$GITHUB_SHA" > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$VERSION" --notes-file notes.md --draft
            gh release upload "$TAG" dist/platform-tools-"$VERSION".tar.gz dist/build-tools-"$VERSION".zip --clobber
          else
            gh release create "$TAG" dist/platform-tools-"$VERSION".tar.gz dist/build-tools-"$VERSION".zip \
              --title "$VERSION" --notes-file notes.md --draft --verify-tag
          fi
