name: build

# Keep only the newest build for each version branch; source builds are expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master, main, platform-tools-35.0.2, platform-tools-36.0.0 ]
    paths-ignore:
      - '**.md'
      - 'LICENSE.txt'
  pull_request:
  workflow_dispatch:
    inputs:
      toolchain:
        description: 'toolchain'
        type: choice
        options: [ ndk, zig ]
        default: ndk
      release:
        description: 'publish draft SDK packages to GitHub Releases'
        type: boolean
        default: true

permissions:
  contents: write

env:
  TOOLCHAIN: ${{ inputs.toolchain || 'ndk' }}
  LINK: static
  NDK_VERSION: r27c
  ZIG_VERSION: 0.13.0
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      source-tag: ${{ steps.version.outputs.source-tag }}
      cache-key: ${{ steps.version.outputs.cache-key }}
    steps:
      - uses: actions/checkout@v4

      - name: Read PLATFORM_TOOLS_VERSION
        id: version
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*#define[[:space:]]+PLATFORM_TOOLS_VERSION[[:space:]]+"([^"]+)".*/\1/p' patches/misc/platform_tools_version.h | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::PLATFORM_TOOLS_VERSION not found"
            exit 1
          fi
          # Starting with Platform Tools 36.0.0, AOSP no longer publishes
          # platform-tools-* source refs. Use the Android 16 release manifest
          # snapshot; repository.json entries may still pin independent refs.
          SOURCE_TAG="platform-tools-$VERSION"
          if [ "$VERSION" = "35.0.0" ]; then
            SOURCE_TAG="platform-tools-35.0.1"
          elif [ "$VERSION" = "36.0.0" ]; then
            SOURCE_TAG="android-16.0.0_r1"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source-tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "cache-key=sources-$VERSION-$SOURCE_TAG-${{ hashFiles('repository.json', 'get_source.py', 'build.py', 'patches/**') }}" >> "$GITHUB_OUTPUT"
          echo "platform-tools version: $VERSION"
          echo "AOSP source tag: $SOURCE_TAG"

      - name: Check sources cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src
            !src/**/.git
            host-tools
          key: ${{ steps.version.outputs.cache-key }}
          lookup-only: true

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build bison flex patch

      - name: Setup Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Fetch sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 get_source.py --tags "${{ steps.version.outputs.source-tag }}"

      - name: Build host protoc
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 build.py --protoc-only --protoc-output host-tools/protoc

      - name: Save sources cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src
            !src/**/.git
            host-tools
          key: ${{ steps.version.outputs.cache-key }}

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [ aarch64, arm, x86_64, i686 ]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build bison flex

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Restore sources
        uses: actions/cache/restore@v4
        with:
          path: |
            src
            !src/**/.git
            host-tools
          key: ${{ needs.prepare.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Setup NDK
        id: ndk
        if: env.TOOLCHAIN == 'ndk'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Setup zig
        if: env.TOOLCHAIN == 'zig'
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          python3 build.py \
            --toolchain "$TOOLCHAIN" \
            --arch "${{ matrix.arch }}" \
            --link "$LINK" \
            --protoc host-tools/protoc \
            --output-dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-tools-${{ env.LINK }}-${{ matrix.arch }}
          path: dist/android-sdk-tools-${{ env.LINK }}-${{ matrix.arch }}.zip
          if-no-files-found: error

  package-release:
    needs: [ prepare, build ]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-24.04
    concurrency:
      group: sdk-release-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download all four ABI build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: android-sdk-tools-*
          path: artifacts
          merge-multiple: false

      - name: Build complete Google SDK archives
        run: |
          set -euo pipefail
          python3 scripts/package_sdk.py \
            --version "${{ needs.prepare.outputs.version }}" \
            --artifacts artifacts \
            --output dist
          ls -lh dist
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 8

      - name: Upload completed SDK packages for release
        uses: actions/upload-artifact@v4
        with:
          name: sdk-packages-${{ needs.prepare.outputs.version }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    needs: [ prepare, package-release ]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download SDK packages for draft release
        uses: actions/download-artifact@v4
        with:
          name: sdk-packages-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Publish complete SDK packages as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          TAG="platform-tools-$VERSION"
          git push --force origin "$GITHUB_SHA:refs/tags/$TAG"
          NOTES="Release packages for Android Platform Tools $VERSION and Build Tools $VERSION."
          printf '%s\\n\\nCommit: %s\\n' "$NOTES" "$GITHUB_SHA" > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$VERSION" --notes-file notes.md --draft
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$VERSION" --notes-file notes.md --draft --verify-tag
          fi
